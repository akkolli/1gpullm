[project]
name = "one-gpu-lm"
version = "0.1.0"
description = "Single-GPU GPT-style language model training"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.8.4",
    "tokenizers>=0.22.2",
    "torch>=2.11.0",
    "torchao>=0.17.0",
]

[project.scripts]
lm-data = "scripts.prepare_data:main"
lm-train = "scripts.train:main"
lm-sft = "scripts.sft:main"
lm-chat = "scripts.chat:main"
lm-eval = "scripts.eval_core:main"
lm-generate = "scripts.generate:main"
lm-profile = "scripts.profile_train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["one_gpu_lm", "scripts"]
